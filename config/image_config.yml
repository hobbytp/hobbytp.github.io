# 博客图片生成配置（Category Visual Identity System）
image_generation:
  style: "category_visual_identity_system"
  dimensions: "1200x630"
  output_path: "static/images/articles"

rate_limits:
  daily_limit: 5
  hourly_limit: 1

# 提示词模板
prompt_template: |
  Create a high-craft, distinctive 16:9 widescreen blog cover image strictly following the Category Visual Identity System (CVIS):

  Core Rules:
  - Keep the visual art style, material texture, and base palette LOCKED to the Category Track below so articles in the same category look cohesive, while different categories look immediately distinct.
  - Translate the specific article concepts into 2-3 concrete physical visual metaphors interacting in a dynamic non-centered composition (Isometric 45° diorama, Exploded cutaway, Rule-of-Thirds negative space, Diagonal pipeline, or Macro tilt-shift).
  - Strictly NO text, letters, numbers, logos, watermarks, human faces, or cliché floating glowing brains in space.
  - Dimensions: 1200x630px (landscape widescreen format).

  Content Context:
  Blog Title: {title}
  Category: {category}
  Tags: {tags}
  Summary: {summary}

# 7大内容赛道风格映射（同类型统一画风，跨类型鲜明区分）
category_styles:
  # Track 1: 课程与体系化学习
  courses: "Editorial Geometric Vector Illustration (Anthropic Engineering / MIT Tech Review cover style), subtle printmaker grain texture, warm ivory & sandstone backdrop, refined charcoal & academic accent colors (Stanford Cardinal Red if Stanford, MIT Crimson if MIT)."
  interviews: "Editorial Geometric Vector Illustration with subtle printmaker grain, warm ivory & sandstone palette, architectural lecture steps and geometric instruments."
  base: "Editorial Geometric Vector Illustration with subtle printmaker grain, warm ivory & sandstone palette, structured modular building blocks."
  # Track 2: 论文解读与数理前沿
  papers: "Nature/Science journal cover Scientific Visualization & Optical Blueprint style, deep starry indigo & obsidian backdrop, high-refraction crystal polyhedra, golden optical paths, precision grid lines."
  imo: "Scientific Visualization & Optical Blueprint style, deep indigo backdrop, golden geometric manifolds and optical refraction prisms."
  worldlab: "Scientific Visualization & Optical Blueprint style, deep indigo backdrop, holographic spatial terrain diorama and optical projection prisms."
  validation: "Scientific Visualization & Optical Blueprint style, precision calibration scales, laser gridlines, deep indigo & amber gold."
  # Track 3: 智能体、工程架构与编程
  mas: "Dieter Rams & Bauhaus Modular Isometric 3D industrial design aesthetic, light titanium-gray studio backdrop, anodized aluminum modules, matte carbon fiber, industrial orange & electric cyan pipelines."
  context_engineering: "Dieter Rams & Bauhaus Modular Isometric 3D style, translucent layered memory cassettes, precision sliding tracks, studio titanium gray & industrial orange."
  ai_programming: "Dieter Rams & Bauhaus Modular Isometric 3D style, precision mechanical typesetting arms, modular blueprint workbench, studio titanium gray & cyan."
  rag: "Dieter Rams & Bauhaus Modular Isometric 3D style, indexed archive drawers with luminous index tabs and optical lenses, titanium gray & electric cyan."
  ai_spec: "Dieter Rams & Bauhaus Modular Isometric 3D style, interlocking standardized interface sockets and calibration blocks."
  evaluate: "Dieter Rams & Bauhaus Modular Isometric 3D style, precision balance scales, calibration dials, and isolated testing sandboxes."
  training: "Dieter Rams & Bauhaus Modular Isometric 3D style, kinetic data flywheel turbines and precision feedback gyroscopes."
  technologies: "Dieter Rams & Bauhaus Modular Isometric 3D style, modular engineering components and precision mechanical joints."
  # Track 4: 大模型与大厂产品线
  large_models: "Futuristic 3D Glassmorphism & Studio Caustics (Octane Render), stacked frosted glass lenses, brushed titanium core, dramatic studio rim lighting and caustic reflections."
  claude: "Futuristic 3D Glassmorphism & Studio Caustics, Anthropic warm terracotta orange, parchment ivory, and deep charcoal frosted glass sculptures."
  openai: "Futuristic 3D Glassmorphism & Studio Caustics, emerald mint & obsidian black frosted glass sculptures with studio caustic light."
  google: "Futuristic 3D Glassmorphism & Studio Caustics, multi-spectral sapphire blue, amber, coral, and emerald prism light refractions."
  deepseek: "Futuristic 3D Glassmorphism & Studio Caustics, abyssal ocean blue & bioluminescent cyan translucent sculptures."
  qwen: "Futuristic 3D Glassmorphism & Studio Caustics, violet indigo & warm gold translucent sculptures."
  nvidia: "Futuristic 3D Glassmorphism & Studio Caustics, compute neon green & matte carbon black metallic glass sculptures."
  # Track 5: 开源项目与动手工具
  projects: "Tactile 3D Voxel & Clay Maker Workbench Diorama, vibrant maker palette (bright orange, mint green, Klein blue on warm white desk), snap-fit modular blocks and tiny craft tools."
