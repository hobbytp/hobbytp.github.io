  # Track 6: 个人洞察、名人观点与思辨
  my_insights: "The New Yorker Conceptual Surrealism & Philosophical Metaphor Art, generous negative space, muted mineral palette (ochre, forest green, warm umber, ivory), bronze astrolabe, architectural stairs, dramatic chiaroscuro."
  celebrity_insights: "The New Yorker Conceptual Surrealism & Philosophical Metaphor Art, timeless philosophical objects (hourglass, mirrored monolith, classical archway) with dramatic lighting and generous negative space."
